<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1420" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#121830"/>
    </linearGradient>
    <linearGradient id="nsoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="customerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#0f1923"/>
    </linearGradient>
    <linearGradient id="victimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1a1a"/>
      <stop offset="100%" stop-color="#1a0f0f"/>
    </linearGradient>
    <linearGradient id="vectorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="100%" stop-color="#0f1f0f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a90d9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#40c060"/>
    </marker>
    <marker id="arrowYellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c0c040"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c040c0"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1420" fill="url(#bg)"/>

  <!-- ==================== TITLE ==================== -->
  <text x="700" y="38" text-anchor="middle" fill="#e0e0e0" font-size="24" font-weight="bold">
    NSO Group Pegasus — Internal Architecture &amp; Infection Flow
  </text>
  <text x="700" y="60" text-anchor="middle" fill="#7a8aaa" font-size="13">
    Source: Amnesty International (2026-07) — Leaked WhatsApp v. NSO court documents (ECF 796–800)
  </text>

  <!-- ==================== ROW 1: NSO GROUP (y=80–150) ==================== -->
  <rect x="80" y="80" width="220" height="70" rx="8" fill="#1a1a2e" stroke="#3a5a8a" stroke-width="1.5" filter="url(#glow)"/>
  <text x="190" y="105" text-anchor="middle" fill="#6ab0ff" font-size="14" font-weight="bold">🛡️ White Services</text>
  <text x="190" y="122" text-anchor="middle" fill="#8899bb" font-size="10">Anonymous infrastructure</text>
  <text x="190" y="136" text-anchor="middle" fill="#8899bb" font-size="10">Crypto-paid · Per-customer isolated</text>

  <rect x="340" y="80" width="200" height="70" rx="8" fill="#1a1a2e" stroke="#3a5a8a" stroke-width="1.5"/>
  <text x="440" y="105" text-anchor="middle" fill="#6ab0ff" font-size="14" font-weight="bold">📡 NOC</text>
  <text x="440" y="122" text-anchor="middle" fill="#8899bb" font-size="10">Network Operations Center</text>
  <text x="440" y="136" text-anchor="middle" fill="#8899bb" font-size="10">Monitoring · Alert response</text>

  <rect x="580" y="80" width="200" height="70" rx="8" fill="#1a1a2e" stroke="#3a5a8a" stroke-width="1.5"/>
  <text x="680" y="105" text-anchor="middle" fill="#6ab0ff" font-size="14" font-weight="bold">⛔ Abuse Prevention</text>
  <text x="680" y="122" text-anchor="middle" fill="#8899bb" font-size="10">Target frequency limits</text>
  <text x="680" y="136" text-anchor="middle" fill="#8899bb" font-size="10">Wait periods · Whitelist</text>

  <rect x="820" y="80" width="200" height="70" rx="8" fill="#1a1a2e" stroke="#3a5a8a" stroke-width="1.5"/>
  <text x="920" y="105" text-anchor="middle" fill="#6ab0ff" font-size="14" font-weight="bold">🔬 Exploit Dev</text>
  <text x="920" y="122" text-anchor="middle" fill="#8899bb" font-size="10">New vectors · Patch evasion</text>
  <text x="920" y="136" text-anchor="middle" fill="#8899bb" font-size="10">Heaven · Erised · Eden</text>

  <rect x="1060" y="80" width="280" height="70" rx="8" fill="#1a1a2e" stroke="#3a5a8a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="1200" y="105" text-anchor="middle" fill="#6ab0ff" font-size="14" font-weight="bold">🧪 Sales 3 / Sales 6</text>
  <text x="1200" y="122" text-anchor="middle" fill="#8899bb" font-size="10">Internal test deployments</text>
  <text x="1200" y="136" text-anchor="middle" fill="#8899bb" font-size="10">Demo infections · NSO staff numbers</text>

  <!-- ==================== ROW 2: ANONYMIZATION (y=190–245) ==================== -->
  <rect x="150" y="190" width="1100" height="55" rx="8" fill="#0d1520" stroke="#2a3a5a" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="700" y="213" text-anchor="middle" fill="#4a6aaa" font-size="13" font-weight="bold">🔄 Anonymization Network ("Whitened" Infrastructure)</text>
  <text x="700" y="232" text-anchor="middle" fill="#5a6a8a" font-size="11">Customer-specific relay chain · Crypto-paid servers · No cross-contamination between customers</text>

  <!-- NSO → Anon arrows -->
  <line x1="190" y1="150" x2="350" y2="190" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="150" x2="550" y2="190" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="245" x2="240" y2="290" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== ROW 3: DASHBOARD + VECTORS (y=290–470) ==================== -->

  <!-- Dashboard -->
  <rect x="80" y="290" width="280" height="180" rx="10" fill="#1b2838" stroke="#2a4a6a" stroke-width="2" filter="url(#glow)"/>
  <text x="220" y="315" text-anchor="middle" fill="#4ac8ff" font-size="15" font-weight="bold">🖥️ Pegasus Dashboard</text>
  <text x="220" y="333" text-anchor="middle" fill="#7a9abf" font-size="11">Browser-based · On-premises</text>
  <text x="220" y="355" text-anchor="middle" fill="#6a8aaf" font-size="10">Roles: analyst · operator</text>
  <text x="220" y="370" text-anchor="middle" fill="#6a8aaf" font-size="10">supervisor · admin</text>
  <text x="220" y="392" text-anchor="middle" fill="#6a8aaf" font-size="10">Target input · Fingerprinting</text>
  <text x="220" y="407" text-anchor="middle" fill="#6a8aaf" font-size="10">Vector selection (automatic)</text>
  <text x="220" y="429" text-anchor="middle" fill="#6a8aaf" font-size="10">Credentials tab · Cloud extraction</text>
  <text x="220" y="460" text-anchor="middle" fill="#a04040" font-size="9" font-style="italic">↩ Surveillance data returns here</text>

  <!-- Zero-click -->
  <rect x="420" y="290" width="280" height="180" rx="10" fill="#1a2a1a" stroke="#2a6a2a" stroke-width="1.5"/>
  <text x="560" y="315" text-anchor="middle" fill="#40c060" font-size="14" font-weight="bold">⚡ Zero-Click ("Covert")</text>
  <rect x="435" y="330" width="120" height="30" rx="4" fill="#0a1a0a" stroke="#2a5a2a"/>
  <text x="495" y="349" text-anchor="middle" fill="#50d070" font-size="11" font-weight="bold">Heaven</text>
  <rect x="565" y="330" width="120" height="30" rx="4" fill="#0a1a0a" stroke="#2a5a2a"/>
  <text x="625" y="349" text-anchor="middle" fill="#50d070" font-size="11" font-weight="bold">Erised</text>
  <rect x="435" y="370" width="120" height="30" rx="4" fill="#0a1a0a" stroke="#2a5a2a"/>
  <text x="495" y="389" text-anchor="middle" fill="#50d070" font-size="11" font-weight="bold">Eden</text>
  <rect x="565" y="370" width="120" height="30" rx="4" fill="#0a1a0a" stroke="#2a5a2a"/>
  <text x="625" y="389" text-anchor="middle" fill="#50d070" font-size="11" font-weight="bold">iOS Covert</text>
  <text x="495" y="418" text-anchor="middle" fill="#3a6a3a" font-size="9">Android · WhatsApp</text>
  <text x="625" y="418" text-anchor="middle" fill="#3a6a3a" font-size="9">iMessage · Apple IDs</text>
  <text x="560" y="455" text-anchor="middle" fill="#3a5a3a" font-size="9" font-style="italic">Umbrella: "Hummingbird"</text>

  <!-- 1-click -->
  <rect x="740" y="290" width="220" height="180" rx="10" fill="#1a1a0a" stroke="#6a6a2a" stroke-width="1.5"/>
  <text x="850" y="315" text-anchor="middle" fill="#c0c040" font-size="14" font-weight="bold">📩 1-Click ("Triggered")</text>
  <text x="850" y="345" text-anchor="middle" fill="#9a9a6a" font-size="11">Social engineering lures</text>
  <text x="850" y="365" text-anchor="middle" fill="#7a7a5a" font-size="10">SMS / WhatsApp links</text>
  <text x="850" y="385" text-anchor="middle" fill="#7a7a5a" font-size="10">System crafts messages</text>
  <text x="850" y="405" text-anchor="middle" fill="#7a7a5a" font-size="10">Cover stories for target</text>
  <text x="850" y="455" text-anchor="middle" fill="#5a5a3a" font-size="9" font-style="italic">Fallback when 0-click fails</text>

  <!-- Network injection -->
  <rect x="1000" y="290" width="260" height="180" rx="10" fill="#1a0a1a" stroke="#6a2a6a" stroke-width="1.5"/>
  <text x="1130" y="315" text-anchor="middle" fill="#c040c0" font-size="14" font-weight="bold">🌐 Network Injection</text>
  <text x="1130" y="345" text-anchor="middle" fill="#9a6a9a" font-size="11">Tactical Network Element</text>
  <text x="1130" y="365" text-anchor="middle" fill="#7a5a7a" font-size="10">MiTM · Inline injection</text>
  <text x="1130" y="385" text-anchor="middle" fill="#7a5a7a" font-size="10">Intercepts HTTP/HTTPS traffic</text>
  <text x="1130" y="405" text-anchor="middle" fill="#7a5a7a" font-size="10">Physical access vector</text>
  <text x="1130" y="455" text-anchor="middle" fill="#5a3a5a" font-size="9" font-style="italic">Radio/WiFi/BT [Redacted]</text>

  <!-- ==================== ROW 4: ATTACK INFRASTRUCTURE (y=550–650) ==================== -->
  <!-- Gap of 80px between vectors (end y=470) and this box (start y=550) -->
  <rect x="80" y="550" width="1240" height="55" rx="8" fill="#0d1520" stroke="#2a3a5a" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="700" y="573" text-anchor="middle" fill="#4a6aaa" font-size="13" font-weight="bold">🔑 Customer-Specific Attack Infrastructure (Forensic Fingerprint)</text>
  <text x="700" y="592" text-anchor="middle" fill="#5a6a8a" font-size="11">Anonymous Gmail/Outlook → Apple IDs · Per-customer domains · Unique WhatsApp accounts · "Never shared across customers"</text>

  <!-- Infrastructure items (centered: 5 boxes × 180px + 4 gaps × 20px = 980px, start x = (1400-980)/2 = 210) -->
  <rect x="210" y="615" width="180" height="35" rx="6" fill="#121a2a" stroke="#2a4a6a"/>
  <text x="300" y="637" text-anchor="middle" fill="#6ab0ff" font-size="11">📧 Attacker Email Accounts</text>
  <rect x="410" y="615" width="180" height="35" rx="6" fill="#121a2a" stroke="#2a4a6a"/>
  <text x="500" y="637" text-anchor="middle" fill="#6ab0ff" font-size="11">🍎 Malicious Apple IDs</text>
  <rect x="610" y="615" width="180" height="35" rx="6" fill="#121a2a" stroke="#2a4a6a"/>
  <text x="700" y="637" text-anchor="middle" fill="#6ab0ff" font-size="11">🌐 Infection Domains</text>
  <rect x="810" y="615" width="180" height="35" rx="6" fill="#121a2a" stroke="#2a4a6a"/>
  <text x="900" y="637" text-anchor="middle" fill="#6ab0ff" font-size="11">💬 WhatsApp Accounts</text>
  <rect x="1010" y="615" width="180" height="35" rx="6" fill="#121a2a" stroke="#2a4a6a"/>
  <text x="1100" y="637" text-anchor="middle" fill="#6ab0ff" font-size="11">🖥️ Infection Servers</text>

  <!-- Supply lines: Attack Infra items → Vectors (clean, from y=615 up to y=470) -->
  <line x1="500" y1="615" x2="495" y2="470" stroke="#3a5a7a" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="700" y1="615" x2="560" y2="470" stroke="#3a5a7a" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="900" y1="615" x2="740" y2="470" stroke="#3a5a7a" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ==================== ROW 5: TARGET DEVICE (y=750–880) ==================== -->
  <!-- Vector → Target arrows (from vector bottom y=470 to target y=750) -->
  <line x1="495" y1="470" x2="560" y2="750" stroke="#40c060" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>
  <line x1="850" y1="470" x2="700" y2="750" stroke="#c0c040" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowYellow)"/>
  <line x1="1130" y1="470" x2="840" y2="750" stroke="#c040c0" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowPurple)"/>

  <rect x="400" y="750" width="600" height="120" rx="12" fill="#2a1a1a" stroke="#6a2a2a" stroke-width="2" filter="url(#glow)"/>
  <text x="700" y="778" text-anchor="middle" fill="#ff6060" font-size="16" font-weight="bold">📱 Target Device</text>
  <text x="700" y="800" text-anchor="middle" fill="#9a6a6a" font-size="12">iOS (iPhone) · Android · iPad</text>

  <rect x="430" y="815" width="120" height="28" rx="4" fill="#1a0a0a" stroke="#5a2a2a"/>
  <text x="490" y="833" text-anchor="middle" fill="#cc6060" font-size="10">Messages</text>
  <rect x="560" y="815" width="120" height="28" rx="4" fill="#1a0a0a" stroke="#5a2a2a"/>
  <text x="620" y="833" text-anchor="middle" fill="#cc6060" font-size="10">Camera/Mic</text>
  <rect x="690" y="815" width="120" height="28" rx="4" fill="#1a0a0a" stroke="#5a2a2a"/>
  <text x="750" y="833" text-anchor="middle" fill="#cc6060" font-size="10">Location</text>
  <rect x="820" y="815" width="120" height="28" rx="4" fill="#1a0a0a" stroke="#5a2a2a"/>
  <text x="880" y="833" text-anchor="middle" fill="#cc6060" font-size="10">Passwords</text>

  <text x="700" y="860" text-anchor="middle" fill="#6a4a4a" font-size="9" font-style="italic">Encrypted apps (Signal, WhatsApp) · Emails · Contacts · Call logs · Cloud (iCloud/Google)</text>

  <!-- ==================== ROW 6: FORENSIC ATTRIBUTION (y=910–1070) ==================== -->
  <rect x="80" y="910" width="1240" height="165" rx="8" fill="#0d0d15" stroke="#3a3a5a" stroke-width="1"/>
  <text x="700" y="940" text-anchor="middle" fill="#6a7aaa" font-size="14" font-weight="bold">🔍 Forensic Attribution Methodology (Validated by Court Documents)</text>
  <text x="700" y="972" text-anchor="middle" fill="#8a9abf" font-size="12">▸ Each customer receives UNIQUE Apple IDs, domains, email accounts, WhatsApp accounts</text>
  <text x="700" y="1000" text-anchor="middle" fill="#8a9abf" font-size="12">▸ Same account/domain across multiple victims = same Pegasus customer</text>
  <text x="700" y="1028" text-anchor="middle" fill="#8a9abf" font-size="12">▸ Multiple Apple IDs probing same target = system testing different vectors</text>
  <text x="700" y="1058" text-anchor="middle" fill="#7a8aaf" font-size="11" font-style="italic">Amnesty: "Across hundreds of cases, never observed a single attacker account or infection domain being used by more than one customer"</text>

  <!-- ==================== ROW 7: COURT REFERENCES (y=1100–1185) ==================== -->
  <rect x="80" y="1100" width="1240" height="85" rx="8" fill="#0a0a12" stroke="#2a2a4a" stroke-width="1"/>
  <text x="700" y="1127" text-anchor="middle" fill="#5a6a8a" font-size="12" font-weight="bold">⚖️ Court Case References (WhatsApp v. NSO Group — ECF Filings)</text>
  <text x="120" y="1152" fill="#4a5a7a" font-size="10">ECF 796-5: Eshkar Deposition (NSO Group employee testimony)</text>
  <text x="120" y="1172" fill="#4a5a7a" font-size="10">ECF 796-6: Expert Report of Anthony Vance</text>
  <text x="500" y="1152" fill="#4a5a7a" font-size="10">ECF 796-15: Pegasus v3.0 Product Description (August 2018)</text>
  <text x="500" y="1172" fill="#4a5a7a" font-size="10">ECF 796-18: Abuse Prevention documentation</text>
  <text x="900" y="1152" fill="#4a5a7a" font-size="10">ECF 796-19: Heaven vector release notes</text>
  <text x="900" y="1172" fill="#4a5a7a" font-size="10">ECF 800-3: White Services designation list</text>

  <!-- ==================== ROW 8: TIMELINE (y=1215–1270) ==================== -->
  <rect x="80" y="1215" width="1240" height="55" rx="8" fill="#0a0a12" stroke="#1a2a4a" stroke-width="1"/>
  <text x="700" y="1238" text-anchor="middle" fill="#3a5a7a" font-size="11" font-weight="bold">📅 Evolution Timeline</text>
  <text x="120" y="1258" fill="#3a4a6a" font-size="10">2013: BlackBerry → 2018: Heaven (first Android 0-click) → 2018-20: Hummingbird (WhatsApp) → 2019: iOS iMessage 0-click → 2021: Pegasus Project → 2024-25: New vectors → 2026-07: Amnesty internal docs</text>

  <!-- ==================== ROW 9: AI WATERMARK (y=1300–1340) ==================== -->
  <rect x="80" y="1300" width="1240" height="36" rx="6" fill="#06080c" stroke="#151522" stroke-width="0.5"/>
  <text x="120" y="1323" fill="#5a5a7a" font-size="10" font-style="italic">⚡ Generated with AI assistance (Jarvis / GLM-5.2) — Diagram based on verified Amnesty International research data</text>
  <text x="1280" y="1323" text-anchor="end" fill="#4a4a6a" font-size="9">⚠ AI-assisted content</text>

  <!-- Footer -->
  <text x="700" y="1380" text-anchor="middle" fill="#3a3a5a" font-size="9">
    The NSO Blacklist · github.com/0n1cOn3/The-NSO-Blacklist · IOCs for network defense
  </text>
</svg>
